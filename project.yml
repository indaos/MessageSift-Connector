name: MessageSiftConnector
options:
  bundleIdPrefix: com.dmikaya
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: 5PMP974V72
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_HARDENED_RUNTIME: YES
schemes:
  MessageSiftConnector:
    build:
      targets:
        MessageSift Connector: all
        ConnectorTests: [test]
    test:
      targets: [ConnectorTests]
targets:
  MessageSift Connector:
    type: application
    platform: macOS
    sources: [Sources]
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: MessageSift Connector
        CFBundleName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleURLTypes:
          - CFBundleURLName: com.dmikaya.MessageHub.Connector
            CFBundleURLSchemes: [messagesift-connector]
        NSHumanReadableCopyright: © 2026 Denis Mikaya. MIT License.
    entitlements:
      path: Sources/App/Connector.entitlements
      properties:
        # Not sandboxed: Notification Center and WhatsApp data need Full Disk Access.
        # Not sandboxed, so no network entitlement is needed for Slack, GitHub, GitLab, Jira, Linear and Microsoft Graph.
        com.apple.security.app-sandbox: false
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.dmikaya.MessageHub.store]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmikaya.MessageHub.Connector
        PRODUCT_NAME: MessageSift Connector
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ConnectorTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: MessageSift Connector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmikaya.MessageHub.ConnectorTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MessageSift Connector.app/Contents/MacOS/MessageSift Connector
        BUNDLE_LOADER: $(TEST_HOST)
